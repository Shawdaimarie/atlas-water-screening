apiVersion: v1
kind: ResourceQuota
metadata:
  name: atlas-workload-budget
  namespace: atlas
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-api-availability
  namespace: atlas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-api
