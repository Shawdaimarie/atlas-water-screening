protocol:
  id: atlas-study-area-validation
  version: 1
  state: proposed_not_externally_preregistered
  freeze_before: inspecting_candidate_area_product_outcomes_or_reference_labels
  study_areas:
    total_candidates: 16
    united_states: 8
    international: 8
    selection: purposive_stratified
    generalization: enrolled_sites_only_no_national_or_global_city_prevalence
    nominal_aoi_km2: 625
  product:
    collection: OPERA_L3_DSWX-S1_V1
    grid_resolution_m: 30
    primary_layer: BWTR
    valid_classes:
      0: nonwater
      1: water
    invalid_classes:
      250: hand_masked
      251: layover_or_shadow
      other: fill_or_no_data
    invalid_is_missing_not_dry: true
  discovery_only:
    prior_date_floor: 90
    prior_date_floor_is_enrollment_gate: false
    feasibility_min_dates_per_period: 3
    feasibility_valid_fraction_per_scene: 0.80
    feasibility_floors_establish_statistical_adequacy: false
    valid_fraction_sensitivity: 0.90
  event:
    selection_independent_of_tested_product_outcomes: true
    primary_reference_max_lag_hours: 24
    sensitivity_reference_lag_hours: [24, 72]
    exclude_primary_if_lag_exceeds_hours: 72
    require_fixed_aoi_intersection: true
    baseline_must_be_non_event_and_context_matched: true
    matched_observation_count_across_sites: true
  reference_labels:
    classes:
      - event_floodwater
      - persistent_water
      - nonwater
      - ambiguous
      - unobservable
    independent_labelers: 2
    blind_to_tested_product: true
    adjudicate_disagreements: true
    convenience_positive_sample_allowed_as_accuracy_sample: false
    record_inclusion_probabilities: true
  sampling:
    probability_sample: true
    spatial_block_size: estimate_from_pilot_autocorrelation
    adjacent_pixels_independent: false
    confidence_level: 0.95
    target_half_width_proportion: 0.05
    planning_prevalence: 0.5
    simple_random_sample_n0: 385
    inflate_for_design_effect: true
    finite_population_correction_when_applicable: true
    report_achieved_precision_if_target_missed: true
  metrics:
    - raw_confusion_matrix
    - area_weighted_error_matrix
    - user_accuracy_water
    - producer_accuracy_water
    - user_accuracy_nonwater
    - producer_accuracy_nonwater
    - overall_accuracy
    - f1
    - intersection_over_union
    - matthews_correlation_coefficient
    - design_consistent_95_percent_confidence_intervals
    - label_disagreement
    - reference_uncertainty
  enrollment:
    current_confirmatory_areas: 0
    require_independent_event_reference: true
    require_spatially_representative_probability_sample: true
    require_predeclared_precision_or_exploratory_label: true
    complete_comparison_requires_us_sites: 8
    complete_comparison_requires_international_sites: 8
