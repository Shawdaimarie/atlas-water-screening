name: ATLAS verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests-and-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-locked development and reference-audit dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-reference-audit.lock
      - name: Run unit and fixture tests
        run: python -m pytest -q
      - name: Install checksum-pinned Terraform 1.17.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/terraform_1.17.1_linux_amd64.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_amd64.zip \
            --output "$archive"
          echo "4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate all provider cluster profiles without credentials
        run: |
          set -euo pipefail
          terraform fmt -check -recursive deployment/cloud/terraform
          for profile in gke eks aks oke; do
            terraform -chdir="deployment/cloud/terraform/$profile" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="deployment/cloud/terraform/$profile" validate -no-color
          done
      - name: Screen GEOID-Flood footprints against the 16 study areas
        run: |
          python scripts/audit_geoid_flood_overlap.py --output "$RUNNER_TEMP/atlas-geoid-flood-overlap-audit.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "atlas-geoid-flood-overlap-audit.json"
          result = json.loads(result_path.read_text())
          expected = {
              "study_areas": 16,
              "areas_with_reference_footprint": 1,
              "tiles_in_registered_areas": 12,
              "paper_eligible_tiles_in_registered_areas": 12,
              "event_ids_in_registered_areas": ["EMSR203"],
          }
          assert result["summary"] == expected, result["summary"]
          print("GEOID-Flood footprint screen: 16 areas checked; one historical St. Louis event footprint found")
          PY
      - name: Build the same container candidate
        run: docker build --tag atlas-api:${{ github.sha }} .
      - name: Generate and retain SPDX image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: atlas-api:${{ github.sha }}
          format: spdx-json
          output-file: atlas-api-sbom.spdx.json
          upload-artifact: true
      - name: Smoke-test the built container
        run: |
          set -eu
          _container_id=$(docker run -d --rm --read-only -p 127.0.0.1:18081:8080 \
            -e ATLAS_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e ATLAS_CORS_ORIGINS=http://localhost:8000 \
            atlas-api:${{ github.sha }})
          trap 'docker stop "$_container_id" >/dev/null' EXIT
          python scripts/smoke_container.py
      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atlas-api:${{ github.sha }}
          version: 0.76.1
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Audit the built runtime image
        run: docker run --rm --user 0 -v ${{ github.workspace }}:/audit --entrypoint sh atlas-api:${{ github.sha }} -c 'python -m pip install --require-hashes -r /audit/requirements-audit.lock && pip-audit'

  dependency-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-locked development and reference-audit dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-reference-audit.lock
      - name: Block known vulnerable runtime, development, or research-audit dependencies
        run: python -m pip_audit
