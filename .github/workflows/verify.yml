name: ATLAS verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests-and-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-locked development and reference-audit dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-reference-audit.lock
      - name: Run unit and fixture tests
        run: python -m pytest -q
      - name: Screen GEOID-Flood footprints against the 16 study areas
        run: |
          python scripts/audit_geoid_flood_overlap.py --output "$RUNNER_TEMP/atlas-geoid-flood-overlap-audit.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "atlas-geoid-flood-overlap-audit.json"
          result = json.loads(result_path.read_text())
          expected = {
              "study_areas": 16,
              "areas_with_reference_footprint": 1,
              "tiles_in_registered_areas": 12,
              "paper_eligible_tiles_in_registered_areas": 12,
              "event_ids_in_registered_areas": ["EMSR203"],
          }
          assert result["summary"] == expected, result["summary"]
          print("GEOID-Flood footprint screen: 16 areas checked; one historical St. Louis event footprint found")
          PY
      - name: Build the same container candidate
        run: docker build --tag atlas-api:${{ github.sha }} .
      - name: Smoke-test the built container
        run: |
          set -eu
          _container_id=$(docker run -d --rm --read-only -p 127.0.0.1:18081:8080 \
            -e ATLAS_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e ATLAS_CORS_ORIGINS=http://localhost:8000 \
            atlas-api:${{ github.sha }})
          trap 'docker stop "$_container_id" >/dev/null' EXIT
          python scripts/smoke_container.py
      - name: Audit the built runtime image
        run: docker run --rm --user 0 -v ${{ github.workspace }}:/audit --entrypoint sh atlas-api:${{ github.sha }} -c 'python -m pip install --require-hashes -r /audit/requirements-audit.lock && pip-audit'

  dependency-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-locked development and reference-audit dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-reference-audit.lock
      - name: Block known vulnerable runtime, development, or research-audit dependencies
        run: python -m pip_audit
